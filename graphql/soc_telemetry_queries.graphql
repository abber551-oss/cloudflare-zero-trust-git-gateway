query DetectRogueAgentSwarms($accountTag: String!, $start: String!, $end: String!) {
  viewer {
    accounts(filter: { accountTag: $accountTag }) {
      artifactsEventsAdaptiveGroups(
        limit: 100
        filter: { datetime_geq: $start, datetime_leq: $end }
        orderBy: [sum_count_DESC]
      ) {
        dimensions {
          repositoryNamespace
          eventKind
        }
        sum {
          count
        }
      }
    }
  }
}

query DetectPayloadAnomalies($accountTag: String!, $start: String!, $end: String!) {
  viewer {
    accounts(filter: { accountTag: $accountTag }) {
      artifactsEventsAdaptiveGroups(
        limit: 100
        filter: { datetime_geq: $start, datetime_leq: $end, eventKind: "action" }
        orderBy: [quantiles_durationMsP99_DESC]
      ) {
        dimensions {
          repositoryNamespace
        }
        quantiles {
          durationMsP99
        }
        avg {
          durationMs
        }
      }
    }
  }
}
